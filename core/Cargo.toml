[package]
name = "vault_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "bin/uniffi-bindgen.rs"

# Directriz #1: Apple Silicon prevalece. `mlx-accel` está habilitado por defecto.
# Intel compila con --no-default-features y cae a `generate_embedding_fast` (CPU).
[features]
default = ["mlx-accel"]
mlx-accel = ["mlx-rs"]

[dependencies]
uniffi = { version = "0.27", features = ["cli"] }
tokio = { version = "1.37", features = ["full"] }
duckdb = { version = "1.10503.1", features = ["chrono"] }
once_cell = "1.19"
walkdir = "2.5"
notify = "6.1"
mlx-rs = { version = "0.25.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.3", features = ["v4"] }
chrono = "0.4.45"
anyhow = "1.0.103"
lru = "0.12"

[build-dependencies]
uniffi = { version = "0.27", features = ["build"] }
