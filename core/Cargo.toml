[package]
name = "vault_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.27", features = ["cli"] }
tokio = { version = "1.37", features = ["full"] }
duckdb = { version = "1.10503.1" }
once_cell = "1.19"
walkdir = "2.5"
notify = "6.1"
mlx-rs = "0.25.3"

[build-dependencies]
uniffi = { version = "0.27", features = ["build"] }
